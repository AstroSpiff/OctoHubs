services:
  app:
    environment:
      OCTOHUBS_DB_PASSWORD: ""
      OCTOHUBS_DB_PASSWORD_FILE: /run/secrets/octohubs_db_password
    secrets:
      - octohubs_db_password

  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/octohubs_db_password
    secrets:
      - octohubs_db_password

secrets:
  octohubs_db_password:
    file: ${OCTOHUBS_DB_PASSWORD_FILE:?Set OCTOHUBS_DB_PASSWORD_FILE to the host database-password file}
