services:
  # OctoHubs Application
  app:
    # Build locale (usa questa per sviluppo o feature non ancora pushate)
    build:
      context: .
      dockerfile: Dockerfile
    # Build da GitHub (in production sostituisci vX.Y.Z con un tag release numerato)
    # build:
    #   context: https://github.com/AstroSpiff/OctoHubs.git#vX.Y.Z
    #   dockerfile: Dockerfile
    image: octohubs:latest
    container_name: octohubs-app
    restart: unless-stopped
    user: "${OCTOHUBS_UID:-1000}:${OCTOHUBS_GID:-1000}"
    ports:
      - "${OCTOHUBS_BIND_ADDRESS:-127.0.0.1}:${OCTOHUBS_PORT:-5050}:5050"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - PASSWORD_SECRET=${PASSWORD_SECRET:-}
      - PASSWORD_SECRET_PREVIOUS=${PASSWORD_SECRET_PREVIOUS:-}
      - OCTOHUBS_CONFIG_DIR=${OCTOHUBS_CONFIG_DIR:-/config}

      # Admin iniziale (solo primo avvio, poi resta nel DB utenti)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}

      # Webhook Security (optional)
      - WEBHOOK_IP_WHITELIST=${WEBHOOK_IP_WHITELIST:-}
      - WEBHOOK_TRUST_PROXY_HEADERS=${WEBHOOK_TRUST_PROXY_HEADERS:-false}
      - WEBHOOK_TRUSTED_PROXY_CIDRS=${WEBHOOK_TRUSTED_PROXY_CIDRS:-}

      # Session & CSRF security
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-60}
      - CSRF_TIME_LIMIT_SECONDS=${CSRF_TIME_LIMIT_SECONDS:-3600}
      - OCTOHUBS_MAX_REQUEST_BODY_BYTES=${OCTOHUBS_MAX_REQUEST_BODY_BYTES:-1048576}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - OCTOHUBS_PUBLIC_ORIGIN=${OCTOHUBS_PUBLIC_ORIGIN:-}
      - LOGIN_TRUST_PROXY_HEADERS=${LOGIN_TRUST_PROXY_HEADERS:-false}
      - LOGIN_TRUSTED_PROXY_CIDRS=${LOGIN_TRUSTED_PROXY_CIDRS:-}
      - LOGIN_RATE_LIMIT_WINDOW_SECONDS=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      - LOGIN_RATE_LIMIT_IP_ATTEMPTS=${LOGIN_RATE_LIMIT_IP_ATTEMPTS:-20}
      - LOGIN_RATE_LIMIT_USERNAME_ATTEMPTS=${LOGIN_RATE_LIMIT_USERNAME_ATTEMPTS:-5}
      - API_TOKEN_RATE_LIMIT_PER_MINUTE=${API_TOKEN_RATE_LIMIT_PER_MINUTE:-600}
      - API_TOKEN_PREAUTH_RATE_LIMIT_PER_MINUTE=${API_TOKEN_PREAUTH_RATE_LIMIT_PER_MINUTE:-120}
      - API_TOKEN_TRUST_PROXY_HEADERS=${API_TOKEN_TRUST_PROXY_HEADERS:-false}
      - API_TOKEN_TRUSTED_PROXY_CIDRS=${API_TOKEN_TRUSTED_PROXY_CIDRS:-}
      - SERVICE_CONNECTION_CHECK_COOLDOWN_SECONDS=${SERVICE_CONNECTION_CHECK_COOLDOWN_SECONDS:-10}
      - STREAMS_REFRESH_SECONDS=${STREAMS_REFRESH_SECONDS:-15}
      - OCTOHUBS_REALTIME_CONNECTIONS_PER_CHANNEL=${OCTOHUBS_REALTIME_CONNECTIONS_PER_CHANNEL:-3}
      - OCTOHUBS_EVENT_BRIDGE_CONNECTIONS_GLOBAL=${OCTOHUBS_EVENT_BRIDGE_CONNECTIONS_GLOBAL:-64}
      - OCTOHUBS_EVENT_BRIDGE_CONNECTIONS_PER_SERVER=${OCTOHUBS_EVENT_BRIDGE_CONNECTIONS_PER_SERVER:-3}

      # Required operator-managed PostgreSQL connection. This stack never creates
      # or starts a database server; OCTOHUBS_DB_URL may replace the split values.
      - OCTOHUBS_DB_HOST=${OCTOHUBS_DB_HOST:-}
      - OCTOHUBS_DB_PORT=${OCTOHUBS_DB_PORT:-5432}
      - OCTOHUBS_DB_NAME=${OCTOHUBS_DB_NAME:-octohubs}
      - OCTOHUBS_DB_USER=${OCTOHUBS_DB_USER:-octohubs}
      # docker-compose.secrets.yml can replace this with a read-only file secret.
      - OCTOHUBS_DB_PASSWORD=${OCTOHUBS_DB_PASSWORD:-}
      - OCTOHUBS_DB_DRIVER=${OCTOHUBS_DB_DRIVER:-}
      - OCTOHUBS_DB_URL=${OCTOHUBS_DB_URL:-}
      - OCTOHUBS_DB_PARAMS=${OCTOHUBS_DB_PARAMS:-}
      - OCTOHUBS_DB_CONNECT_TIMEOUT_SECONDS=${OCTOHUBS_DB_CONNECT_TIMEOUT_SECONDS:-5}
      - OCTOHUBS_DB_STATEMENT_TIMEOUT_MS=${OCTOHUBS_DB_STATEMENT_TIMEOUT_MS:-30000}
    volumes:
      # Modifica il path host in base al tuo storage.
      - /mnt/shared/config/octohubs:/config
    networks:
      - octohubs-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health/ready', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  octohubs-network:
    driver: bridge
