version: '3.8'

services:
  # OctoHub Application
  app:
    # Build locale (usa questa per sviluppo o feature non ancora pushate)
    build:
      context: .
      dockerfile: Dockerfile
    # Build da GitHub (commenta la sezione build sopra e decommenta questa per production)
    # build:
    #   context: https://github.com/AstroSpiff/OctoHub.git#main
    #   dockerfile: Dockerfile
    image: octohub:latest
    container_name: octohub-app
    restart: unless-stopped
    user: "${OCTOHUB_UID:-0}:${OCTOHUB_GID:-0}"
    ports:
      - "5050:5050"
    environment:
      
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - OCTOHUB_CONFIG_FILE=${OCTOHUB_CONFIG_FILE:-/config/config.json}
      - OCTOHUB_RESULTS_FILE=${OCTOHUB_RESULTS_FILE:-/storage/last_results.json}

      # Authentication Database (SQLite by default, PostgreSQL optional)
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-sqlite:////storage/auth.db}

      # Admin iniziale (solo primo avvio, poi resta nel DB utenti)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      # - ADMIN_PASSWORD_FILE=/run/secrets/octohub_admin_password

      # Webhook Security (optional)
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_IP_WHITELIST=${WEBHOOK_IP_WHITELIST:-}

      # Session & CSRF security
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-60}
      - CSRF_TIME_LIMIT_SECONDS=${CSRF_TIME_LIMIT_SECONDS:-3600}
      # - SESSION_COOKIE_SECURE=true

      # Application Database (PostgreSQL - required)
      # Usare ENV/Secrets: non vengono salvate nel config.json
      - OCTOHUB_DB_HOST=${OCTOHUB_DB_HOST:-}
      - OCTOHUB_DB_PORT=${OCTOHUB_DB_PORT:-}
      - OCTOHUB_DB_NAME=${OCTOHUB_DB_NAME:-}
      - OCTOHUB_DB_USER=${OCTOHUB_DB_USER:-}
      - OCTOHUB_DB_PASSWORD=${OCTOHUB_DB_PASSWORD:-}
      # - OCTOHUB_DB_PASSWORD_FILE=/run/secrets/octohub_db_password
      - OCTOHUB_DB_DRIVER=${OCTOHUB_DB_DRIVER:-}
      - OCTOHUB_DB_URL=${OCTOHUB_DB_URL:-}
      - OCTOHUB_DB_PARAMS=${OCTOHUB_DB_PARAMS:-}
    volumes:
      # Modifica i path host (/mnt/shared/...) in base al tuo storage
      - /mnt/shared/config/octohub:/config
      - /mnt/shared/applications/octohub:/storage
      - /mnt/shared/applications/octohub/logs:/app/logs
    networks:
      - octohub-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5050/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (Optional - for main app data)
  # Usato per i dati applicativi (configurazioni/risultati) se lo abiliti in config.json
  # NOTA: PostgreSQL è OPZIONALE. L'applicazione funziona perfettamente senza DB esterno.
  # - AUTH (utenti/sessioni): usa sempre SQLite in /storage/auth.db
  # - CONFIG/RESULTS: salvati in /config/config.json e /storage/last_results.json
  # - Abilita PostgreSQL SOLO se vuoi storicizzare dati aggiuntivi (history, queue, etc.)
  #
  # Per abilitare PostgreSQL:
  # 1. Decommenta questo servizio
  # 2. Aggiungi il blocco DATABASE in config.json (vedi docs/CONFIGURATION_ita.md)
  # 3. Riavvia i container
  #
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: octohub-postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=${POSTGRES_DB:-octohub}
  #     - POSTGRES_USER=${POSTGRES_USER:-octohub}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-octohub_password}
  #   volumes:
  #     - /mnt/shared/applications/octohub/postgres:/var/lib/postgresql/data
  #   networks:
  #     - octohub-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-octohub}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Nginx Reverse Proxy (opzionale)
  # Decommenta questo blocco per abilitarlo.
  # nginx:
  #   image: nginx:alpine
  #   container_name: octohub-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - /mnt/shared/config/octohub/nginx/ssl:/etc/nginx/ssl:ro
  #     - /mnt/shared/applications/octohub/nginx/logs:/var/log/nginx
  #   networks:
  #     - octohub-network
  #   depends_on:
  #     - app
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

networks:
  octohub-network:
    driver: bridge
