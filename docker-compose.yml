version: '3.8'

services:
  # OctoHub Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octohub-app
    restart: unless-stopped
    environment:
      # Flask Configuration
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-this-secret-key}

      # Authentication Database (SQLite by default, PostgreSQL optional)
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-sqlite:////app/data/auth.db}

      # Default Admin Credentials (CHANGE THESE!)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@localhost}

      # Webhook Security (optional)
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_IP_WHITELIST=${WEBHOOK_IP_WHITELIST:-}

      # Session & CSRF security
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-60}
      - CSRF_TIME_LIMIT_SECONDS=${CSRF_TIME_LIMIT_SECONDS:-3600}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}

      # Application Database (PostgreSQL - optional)
      # Uncomment if using PostgreSQL for main app data
      # - DATABASE_URL=postgresql://octohub:octohub_password@postgres:5432/octohub
    volumes:
      # Persistent data
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config.json:/app/config.json
      - ./last_results.json:/app/last_results.json
    networks:
      - octohub-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: octohub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - octohub-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (Optional - for main app data)
  # Remove or comment if you don't need PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: octohub-postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-octohub}
      - POSTGRES_USER=${POSTGRES_USER:-octohub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-octohub_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - octohub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-octohub}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  octohub-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
