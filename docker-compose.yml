services:
  # OctoHubs Application
  app:
    # Build locale (usa questa per sviluppo o feature non ancora pushate)
    build:
      context: .
      dockerfile: Dockerfile
    # Build da GitHub (commenta la sezione build sopra e decommenta questa per production)
    # build:
    #   context: https://github.com/AstroSpiff/OctoHubs.git#FastAPI
    #   dockerfile: Dockerfile
    image: octohubs:latest
    container_name: octohubs-app
    restart: unless-stopped
    user: "${OCTOHUBS_UID:-0}:${OCTOHUBS_GID:-0}"
    ports:
      - "5050:5050"
    environment:
      
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - OCTOHUBS_CONFIG_FILE=${OCTOHUBS_CONFIG_FILE:-/config/config.json}
      - OCTOHUBS_RESULTS_FILE=${OCTOHUBS_RESULTS_FILE:-/storage/last_results.json}
      - OCTOHUBS_DB_BACKUP_DIR=${OCTOHUBS_DB_BACKUP_DIR:-/storage/db-backups}

      # Authentication Database (SQLite by default, PostgreSQL optional)
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-sqlite:////storage/auth.db}

      # Admin iniziale (solo primo avvio, poi resta nel DB utenti)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      # - ADMIN_PASSWORD_FILE=/run/secrets/octohubs_admin_password

      # Webhook Security (optional)
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_IP_WHITELIST=${WEBHOOK_IP_WHITELIST:-}

      # Session & CSRF security
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-60}
      - CSRF_TIME_LIMIT_SECONDS=${CSRF_TIME_LIMIT_SECONDS:-3600}
      # - SESSION_COOKIE_SECURE=true

      # Application Database (PostgreSQL - required)
      # Usare ENV/Secrets: non vengono salvate nel config.json
      - OCTOHUBS_DB_HOST=${OCTOHUBS_DB_HOST:-}
      - OCTOHUBS_DB_PORT=${OCTOHUBS_DB_PORT:-}
      - OCTOHUBS_DB_NAME=${OCTOHUBS_DB_NAME:-}
      - OCTOHUBS_DB_USER=${OCTOHUBS_DB_USER:-}
      - OCTOHUBS_DB_PASSWORD=${OCTOHUBS_DB_PASSWORD:-}
      # - OCTOHUBS_DB_PASSWORD_FILE=/run/secrets/octohubs_db_password
      - OCTOHUBS_DB_DRIVER=${OCTOHUBS_DB_DRIVER:-}
      - OCTOHUBS_DB_URL=${OCTOHUBS_DB_URL:-}
      - OCTOHUBS_DB_PARAMS=${OCTOHUBS_DB_PARAMS:-}
    volumes:
      # Modifica i path host (/mnt/shared/...) in base al tuo storage
      - /mnt/shared/config/octohubs:/config
      - /mnt/shared/applications/octohubs:/storage
      - /mnt/shared/applications/octohubs/logs:/app/logs
    networks:
      - octohubs-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; sock = socket.create_connection(('127.0.0.1', 5050), timeout=5); sock.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (Optional - for main app data)
  # Usato per i dati applicativi (configurazioni/risultati) se lo abiliti in config.json
  # NOTA: PostgreSQL è OPZIONALE. L'applicazione funziona perfettamente senza DB esterno.
  # - AUTH (utenti/sessioni): usa sempre SQLite in /storage/auth.db
  # - CONFIG/RESULTS: salvati in /config/config.json e /storage/last_results.json
  # - Abilita PostgreSQL SOLO se vuoi storicizzare dati aggiuntivi (history, queue, etc.)
  #
  # Per abilitare PostgreSQL:
  # 1. Decommenta questo servizio
  # 2. Aggiungi il blocco DATABASE in config.json (vedi docs/CONFIGURATION_ita.md)
  # 3. Riavvia i container
  #
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: octohubs-postgres
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=${POSTGRES_DB:-octohubs}
  #     - POSTGRES_USER=${POSTGRES_USER:-octohubs}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-octohubs_password}
  #   volumes:
  #     - /mnt/shared/applications/octohubs/postgres:/var/lib/postgresql/data
  #   networks:
  #     - octohubs-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-octohubs}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Nginx Reverse Proxy (opzionale)
  # Decommenta questo blocco per abilitarlo.
  # nginx:
  #   image: nginx:alpine
  #   container_name: octohubs-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - /mnt/shared/config/octohubs/nginx/ssl:/etc/nginx/ssl:ro
  #     - /mnt/shared/applications/octohubs/nginx/logs:/var/log/nginx
  #   networks:
  #     - octohubs-network
  #   depends_on:
  #     - app
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

networks:
  octohubs-network:
    driver: bridge
