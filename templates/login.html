<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Login - OctoHubs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <div class="login-brand" aria-label="OctoHubs">
                <span class="login-brand-mark" aria-hidden="true">OH</span>
                <strong>OctoHubs</strong>
            </div>
            <header class="login-heading">
                <p>Area riservata</p>
                <h1 id="login-title">Accedi</h1>
            </header>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="login-alert login-alert--{{ category }}" role="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if next_page %}
                    <input type="hidden" name="next" value="{{ next_page }}">
                {% endif %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           required
                           autofocus
                           autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login">Accedi</button>
            </form>

            <footer class="login-footer">Sessione amministrativa</footer>
        </section>
    </main>
</body>
</html>
