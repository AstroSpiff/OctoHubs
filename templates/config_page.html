<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Configurazione OctoHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='config.css') }}">
</head>
<body>
    <div class="container">
        <h1>Configurazione OctoHub</h1>
        <form action="/save" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="jellyseerr_url">Jellyseerr URL</label>
                <input type="url" id="jellyseerr_url" name="jellyseerr_url" placeholder="http://192.168.1.10:5055" required>
            </div>
            <div class="form-group">
                <label for="jellyseerr_api_key">Jellyseerr API Key</label>
                <input type="text" id="jellyseerr_api_key" name="jellyseerr_api_key" required>
            </div>
            <div class="form-group">
                <label for="prowlarr_url">Prowlarr URL</label>
                <input type="url" id="prowlarr_url" name="prowlarr_url" placeholder="http://192.168.1.10:9696" required>
            </div>
            <div class="form-group">
                <label for="prowlarr_api_key">Prowlarr API Key</label>
                <input type="text" id="prowlarr_api_key" name="prowlarr_api_key" required>
            </div>
            <div class="form-group">
                <label for="jackett_url">Jackett URL</label>
                <input type="url" id="jackett_url" name="jackett_url" placeholder="http://192.168.1.10:9117">
            </div>
            <div class="form-group">
                <label for="jackett_api_key">Jackett API Key</label>
                <input type="text" id="jackett_api_key" name="jackett_api_key">
            </div>
            <div class="form-group">
                <label for="qbittorrent_url">qBittorrent URL</label>
                <input type="url" id="qbittorrent_url" name="qbittorrent_url" placeholder="http://host:8080">
            </div>
            <div class="form-group">
                <label for="qbittorrent_username">qBittorrent Username</label>
                <input type="text" id="qbittorrent_username" name="qbittorrent_username">
            </div>
            <div class="form-group">
                <label for="qbittorrent_password">qBittorrent Password</label>
                <input type="password" id="qbittorrent_password" name="qbittorrent_password">
            </div>
            <div class="form-group">
                <label for="db_host">Database Host</label>
                <input type="text" id="db_host" name="db_host" placeholder="localhost">
            </div>
            <div class="form-group">
                <label for="db_port">Database Porta</label>
                <input type="text" id="db_port" name="db_port" placeholder="5432">
            </div>
            <div class="form-group">
                <label for="db_name">Nome Database</label>
                <input type="text" id="db_name" name="db_name" placeholder="jellychecker">
            </div>
            <div class="form-group">
                <label for="db_user">Username Database</label>
                <input type="text" id="db_user" name="db_user">
            </div>
            <div class="form-group">
                <label for="db_password">Password Database</label>
                <input type="password" id="db_password" name="db_password">
            </div>
            <div class="form-group">
                <label for="db_driver">Driver SQLAlchemy</label>
                <input type="text" id="db_driver" name="db_driver" value="postgresql+psycopg2">
            </div>
            <div class="form-group">
                <label for="db_url">Connection URL (opzionale)</label>
                <input type="text" id="db_url" name="db_url" placeholder="postgresql+psycopg2://user:pass@host:5432/dbname">
            </div>
            <div class="form-group">
                <label for="db_params">Parametri extra</label>
                <input type="text" id="db_params" name="db_params" placeholder="sslmode=require">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="trakt_enabled">
                    Abilita integrazione Trakt
                </label>
                <small>Richiede un Client ID e un access token personali.</small>
            </div>
            <div class="form-group">
                <label for="trakt_client_id">Trakt Client ID</label>
                <input type="text" id="trakt_client_id" name="trakt_client_id" placeholder="xxxxxxxxxxxxxxxxxxxx">
            </div>
            <div class="form-group">
                <label for="trakt_access_token">Trakt Access Token</label>
                <input type="text" id="trakt_access_token" name="trakt_access_token" placeholder="Token personale">
            </div>
            <button type="submit" class="btn" title="Salva le impostazioni di configurazione">Salva Configurazione</button>
        </form>
    </div>
</body>
</html>
