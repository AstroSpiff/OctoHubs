name: Release gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend tests, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run the complete Vitest suite
        run: npm test

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all npm build and test dependencies
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

  backend-postgresql:
    name: Backend and PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCTOHUBS_REQUIRE_POSTGRES_TESTS: "1"
      OCTOHUBS_TEST_POSTGRES_URL: postgresql://octohubs_test:octohubs_test@127.0.0.1:5432/octohubs_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: octohubs_test
          POSTGRES_USER: octohubs_test
          POSTGRES_PASSWORD: octohubs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octohubs_test -d octohubs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify patch integrity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "$zero_sha" ]; then
            git diff --check "$PUSH_BEFORE_SHA..$TARGET_SHA"
          else
            git show --check --oneline "$TARGET_SHA"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend and test dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run the complete backend suite against PostgreSQL 16
        run: python -m pytest -q

      - name: Audit production Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Audit Python build and test dependencies
        run: python -m pip_audit -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Reject cyclomatic-complexity regressions
        run: python scripts/check_cyclomatic_complexity.py

      - name: Run the incremental Pyright gate
        run: python -m pyright

      - name: Audit the external API contract
        run: python scripts/audit_external_api_contract.py --strict

      - name: Validate the app-only Compose deployment
        run: |
          docker compose --env-file .env.example config --quiet
          OCTOHUBS_DB_PASSWORD_FILE=/dev/null docker compose --env-file .env.example \
            -f docker-compose.yml -f docker-compose.secrets.yml config --quiet
          ADMIN_PASSWORD_FILE=/dev/null docker compose --env-file .env.example \
            -f docker-compose.yml -f docker-compose.admin-bootstrap.yml config --quiet
          base_services="$(docker compose --env-file .env.example config --services)"
          test "$base_services" = "app"

      - name: Compare two clean production-build inventories
        run: ./scripts/verify_reproducible_build.sh octohubs:release-gate

      - name: Start the production image and verify readiness
        run: ./scripts/smoke_production_image.sh octohubs:release-gate

      - name: Verify the production runtime identity
        run: |
          docker run --rm --entrypoint sh octohubs:release-gate -c '
            test "$(id -u)" = "1000"
            test "$(id -g)" = "1000"
          '
